<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bhairavnath Dairy – Record</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Poppins, sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f9f0,#e9f7ef);padding:20px}
  .wrap{width:820px;max-width:95%;background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,0.08)}
  h1{color:#1e7b38}
  .info{margin-top:12px;padding:12px;border-radius:10px;background:#f7fff7;color:#165c2b}
  .btn{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:10px;background:#1e7b38;color:#fff;border:none;cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐄 Bhairavnath Dairy — Record</h1>
    <div id="content">Loading...</div>

    <button class="btn" id="logout">Logout (clear customer)</button>
  </div>

<script>
  (function(){
    console.log("record.html loaded");

    try {
      const cname = localStorage.getItem('customerName');
      const cnum  = localStorage.getItem('customerNumber');

      if(!cname || !cnum){
        console.warn("Missing customer data — redirecting to ./index.html");
        // small delay so warning shows in console, then redirect
        setTimeout(()=> window.location.href = './index.html', 350);
        return;
      }

      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="info">
          <strong>Customer:</strong> ${escapeHtml(cname)} <br>
          <strong>Number:</strong> ${escapeHtml(cnum)}
        </div>
        <p style="margin-top:12px">This is a placeholder record page. Add daily entry UI here.</p>
      `;

      // logout button clears customer info only
      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('customerName');
        localStorage.removeItem('customerNumber');
        console.log("Customer cleared. Redirecting back to ./index.html");
        window.location.href = './index.html';
      });

    } catch (e) {
      console.error("record page error:", e);
      alert("An error occurred (see console).");
    }

    // small helper to avoid XSS when showing values
    function escapeHtml(s){
      if(!s) return '';
      return s.replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
    }
  })();
</script>
</body>
</html>
