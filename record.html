<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milk Record</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #c1fba4, #a7e9af);
      min-height: 100vh;
      padding: 20px;
    }

    .back-btn {
      background: #17642e;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      margin-top: 10px;
      color: #1e7b38;
      font-size: 32px;
    }

    h3 {
      text-align: center;
      color: #222;
      margin-bottom: 15px;
    }

    .container {
      max-width: 450px;
      background: #fff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    label {
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 15px;
      border: 2px solid #1e7b38;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 11px;
      background: #1e7b38;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    button:hover {
      background: #155b2c;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th {
      background: #1e7b38;
      color: white;
      padding: 10px;
    }

    td {
      text-align: center;
      padding: 10px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .total-box {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
      color: #1e7b38;
    }

    .danger-btn {
      background: #c0392b;
    }

    .danger-btn:hover {
      background: #992f23;
    }

  </style>
</head>
<body>

  <a href="page1.html" class="back-btn">⬅ Back</a>

  <h1>Ganesh Dairy 🥛</h1>
  <h3 id="custInfo"></h3>

  <div class="container">
    <label>Date:</label>
    <input type="date" id="date">

    <label>Litres:</label>
    <input type="number" id="litres" placeholder="Enter litres" step="0.1">

    <label>Price per Litre:</label>
    <input type="number" id="price" placeholder="Price per litre" step="0.1">

    <button onclick="addRecord()">Add Record</button>
    <button class="danger-btn" onclick="clearRecords()">Clear All Records</button>
    <button onclick="downloadCSV()">Download CSV</button>

    <div class="total-box" id="totalDisplay">Total Milk: 0 L | Total Due: ₹0</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Litres</th>
        <th>₹/L</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="recordList"></tbody>
  </table>

  <script>
    // load customer name
    const cname = localStorage.getItem("customerName");
    const cnum = localStorage.getItem("customerNumber");

    if (!cname || !cnum) {
      alert("Login First");
      window.location.href = "page1.html";
    }

    document.getElementById("custInfo").innerText = `Customer: ${cname} (No: ${cnum})`;

    let allRecords = JSON.parse(localStorage.getItem("milkRecords") || "{}");
    let records = allRecords[cnum] || [];

    function renderTable() {
      let table = document.getElementById("recordList");
      table.innerHTML = "";

      let totalMilk = 0;
      let totalPrice = 0;

      records.forEach(r => {
        const tr = `
          <tr>
            <td>${r.date}</td>
            <td>${r.litres}</td>
            <td>${r.price}</td>
            <td>${(r.litres * r.price).toFixed(2)}</td>
          </tr>
        `;
        table.innerHTML += tr;

        totalMilk += parseFloat(r.litres);
        totalPrice += parseFloat(r.litres * r.price);
      });

      document.getElementById("totalDisplay").innerText =
        `Total Milk: ${totalMilk.toFixed(1)} L | Total Due: ₹${totalPrice.toFixed(2)}`;
    }

    renderTable();

    function addRecord() {
      const date = document.getElementById("date").value;
      const litres = parseFloat(document.getElementById("litres").value);
      const price = parseFloat(document.getElementById("price").value);

      if (!date || !litres || !price) {
        alert("Please fill all fields");
        return;
      }

      const newRecord = { date, litres, price };

      records.push(newRecord);
      allRecords[cnum] = records;
      localStorage.setItem("milkRecords", JSON.stringify(allRecords));

      renderTable();

      document.getElementById("date").value = "";
      document.getElementById("litres").value = "";
      document.getElementById("price").value = "";
    }

    function clearRecords() {
      if (!confirm("Delete ALL records?")) return;

      records = [];
      allRecords[cnum] = [];
      localStorage.setItem("milkRecords", JSON.stringify(allRecords));
      renderTable();
    }

    function downloadCSV() {
      let csv = "Date,Litres,Price_per_Litre,Total\n";

      records.forEach(r => {
        csv += `${r.date},${r.litres},${r.price},${(r.litres * r.price).toFixed(2)}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `${cname}_milk_record.csv`;
      a.click();

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
