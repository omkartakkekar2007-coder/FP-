<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Bhairavnath Dairy – Customer Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:"Inter", sans-serif; }

  body{
    background: linear-gradient(135deg,#9be8c7,#f6d5f7);
    background-size:300% 300%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:bgShift 12s ease infinite;
    padding:20px;
  }

  /* Floating milk bottle animation */
  .floating-icon{
    font-size:60px;
    position:absolute;
    top:10%;
    animation:float 4s ease-in-out infinite;
  }
  @keyframes float{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-25px); }
    100%{ transform:translateY(0px); }
  }

  @keyframes bgShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }

  .container{
    background:rgba(255,255,255,0.28);
    backdrop-filter:blur(15px);
    padding:40px 35px;
    width:330px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
    animation:fadeUp 1s ease forwards;
    opacity:0;
  }

  @keyframes fadeUp{
    0%{ opacity:0; transform:translateY(40px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  h1{
    font-size:34px;
    font-weight:800;
    color:#146b34;
    margin-bottom:6px;
    animation:fadeDown 1s ease forwards;
    opacity:0;
  }

  h3{
    color:#333;
    font-weight:500;
    margin-bottom:25px;
    animation:fadeDown 1.3s ease forwards;
    opacity:0;
  }

  @keyframes fadeDown{
    0%{opacity:0; transform:translateY(-25px);}
    100%{opacity:1; transform:translateY(0);}
  }

  input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:#ffffffee;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    transition:0.3s;
    opacity:0;
    transform:translateY(10px);
    animation:slideIn 0.7s ease forwards;
  }

  #custName{ animation-delay:1.4s; }
  #custNumber{ animation-delay:1.6s; }

  @keyframes slideIn{
    100%{ opacity:1; transform:translateY(0); }
  }

  input:focus{
    box-shadow:0 0 10px rgba(20,107,52,0.4);
    transform:scale(1.02);
  }

  button{
    width:100%;
    padding:14px;
    background:#1e7b38;
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:17px;
    margin-top:15px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
    opacity:0;
    transform:scale(0.9);
    animation:btnPop 0.6s ease forwards;
    animation-delay:1.8s;
  }

  @keyframes btnPop{
    100%{ opacity:1; transform:scale(1); }
  }

  button:hover{
    background:#145526;
    transform:scale(1.05);
    box-shadow:0 5px 15px rgba(20,107,52,0.4);
  }

  .error{
    color:#d62828;
    font-size:14px;
    margin-top:12px;
    display:none;
  }

  .loading{
    display:none;
    margin-top:15px;
    color:#146b34;
    font-weight:500;
  }
  .loading::after{
    content:' ...';
    animation:dots 1s infinite;
  }
  @keyframes dots{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
  }
</style>
</head>

<body>

<div class="floating-icon">🥛</div>

<div class="container">
  <h1>🐄 Bhairavnath Dairy</h1>
  <h3>Customer Login</h3>

  <input type="text" id="custName" placeholder="Enter Customer Name">
  <input type="text" id="custNumber" placeholder="Enter Customer Number">

  <button id="loginButton">Login</button>

  <div class="error" id="errorMsg">⚠️ Please fill all fields</div>
  <div class="loading" id="loadingMsg">Signing in</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginButton = document.getElementById("loginButton");
const errorMsg = document.getElementById("errorMsg");
const loadingMsg = document.getElementById("loadingMsg");

async function login(){
    const name = document.getElementById("custName").value.trim();
    const number = document.getElementById("custNumber").value.trim();
    
    errorMsg.style.display="none";

    if(name==="" || number===""){
        errorMsg.style.display="block";
        return;
    }

    loginButton.disabled=true;
    loadingMsg.style.display="block";

    try{
        let userCredential;
        if(initialAuthToken){
            userCredential = await signInWithCustomToken(auth, initialAuthToken);
        } else {
            userCredential = await signInAnonymously(auth);
        }
        
        const userId = userCredential.user.uid;
        const customerDocRef = doc(db, `artifacts/${appId}/users/${userId}/customer_session`, "info");

        await setDoc(customerDocRef, {
            customerName:name,
            customerNumber:number,
            lastLogin:new Date().toISOString()
        });

        window.location.href="./record.html";

    } catch (e){
        errorMsg.textContent="❌ Login failed!";
        errorMsg.style.display="block";
        loginButton.disabled=false;
        loadingMsg.style.display="none";
    }
}

loginButton.addEventListener('click', login);
</script>

</body>
</html>
