<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Bhairavnath Dairy – Customer Login</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Inter", sans-serif; } 

  body {
    /* Updated background for smoother, animated gradient */
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    background-size: 200% 200%; /* For animating the gradient */
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    animation: fadeBody 1s ease forwards, colorShift 15s ease infinite alternate; /* Added colorShift */
  }

  h1 {
    color:#1e7b38;
    margin-bottom:10px;
    font-size:42px;
    animation:fadeDown 1s ease forwards;
    opacity:0;
    font-weight: 800;
  }

  h3 {
    color:#444;
    margin-bottom:20px;
    animation:fadeDown 1.2s ease forwards;
    opacity:0;
    font-weight: 300;
  }

  .login-box {
    background:rgba(255,255,255,0.95);
    padding:26px 32px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15); 
    text-align:center;
    width:320px;
    max-width: 90%;
    animation:fadeUp 1s ease forwards;
    opacity:0;
    animation-delay: 0.3s; /* Delay for smoother sequence */
  }

  input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:2px solid #1e7b38;
    outline:none;
    font-size:15px;
    transition:0.3s ease-in-out; /* Slightly longer transition */
    opacity: 0;
    transform: translateX(-10px);
    animation: inputSlideIn 0.5s ease forwards;
  }
  
  /* Individual input animation delays */
  #custName { animation-delay: 1.2s; }
  #custNumber { animation-delay: 1.4s; }

  input:focus {
    box-shadow:0 0 12px rgba(30, 123, 56, 0.4); 
    transform:scale(1.01); /* Reduced scale for a subtler effect */
  }

  button {
    padding:12px 26px;
    margin-top:20px; /* Increased margin for better spacing */
    background:#1e7b38;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight: 600;
    cursor:pointer;
    transition:0.3s ease; /* Updated transition for smoothness */
    box-shadow:0 4px 10px rgba(30, 123, 56, 0.3);
    opacity: 0;
    transform: scale(0.9);
    animation: buttonPop 0.5s ease forwards;
    animation-delay: 1.6s; /* Delayed to appear after inputs */
  }

  button:hover { 
    background:#145526; 
    transform:scale(1.05); /* Increased hover scale */
    box-shadow:0 6px 15px rgba(30, 123, 56, 0.4);
  }

  .error {
    color:#c62828;
    font-size:14px;
    margin-top:10px;
    display:none;
    font-weight: 500;
    transition: opacity 0.3s;
  }

  /* Loading Indicator Style */
  .loading {
    display: none;
    margin-top: 15px;
    font-size: 16px;
    color: #1e7b38;
  }
  .loading::after {
    content: ' .';
    animation: dots 1s steps(5, end) infinite;
  }

  @keyframes dots {
    0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
    40% { color: #1e7b38; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
    60% { text-shadow: .25em 0 0 #1e7b38, .5em 0 0 rgba(0,0,0,0); }
    80%, 100% { text-shadow: .25em 0 0 #1e7b38, .5em 0 0 #1e7b38; }
  }

  /* New animation for a subtle background color shift */
  @keyframes colorShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* New animation for inputs sliding in */
  @keyframes inputSlideIn {
    100% { opacity: 1; transform: translateX(0); }
  }

  /* New animation for button popping in */
  @keyframes buttonPop {
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeDown {
    0% { opacity:0; transform:translateY(-30px); }
    100% { opacity:1; transform:translateY(0); }
  }

  @keyframes fadeUp {
    0% { opacity:0; transform:translateY(40px); }
    100% { opacity:1; transform:translateY(0); }
  }

  @keyframes fadeBody {
    0% { opacity:0; }
    100% { opacity:1; }
  }
</style>
</head>

<body>

  <h1>🐄 Bhairavnath Dairy 🥛</h1>
  <h3>Customer Login</h3>

  <div class="login-box">
    <input type="text" id="custName" placeholder="Enter Customer Name" />
    <input type="text" id="custNumber" placeholder="Enter Customer Number (e.g., 9876543210)" />

    <button id="loginButton">Login</button>

    <div class="error" id="errorMsg">⚠️ Please enter both Customer Name and Customer Number!</div>
    <div class="loading" id="loadingMsg">Signing in...</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// Global variables provided by the Canvas environment
const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

// Firebase initialization
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginButton = document.getElementById("loginButton");
const errorMsg = document.getElementById("errorMsg");
const loadingMsg = document.getElementById("loadingMsg");

async function login() {
    const name = document.getElementById("custName").value.trim();
    const number = document.getElementById("custNumber").value.trim();
    
    errorMsg.style.display = "none";

    if (name === "" || number === "") {
        errorMsg.textContent = "⚠️ Please enter both Customer Name and Customer Number!";
        errorMsg.style.display = "block";
        return;
    }

    loginButton.disabled = true;
    loadingMsg.style.display = "block";

    try {
        // 1. Authenticate user session
        let userCredential;
        if (initialAuthToken) {
            userCredential = await signInWithCustomToken(auth, initialAuthToken);
        } else {
            userCredential = await signInAnonymously(auth);
        }
        
        const userId = userCredential.user.uid;
        
        // 2. Define Firestore path for private user session data
        const customerDocRef = doc(db, `artifacts/${appId}/users/${userId}/customer_session`, "info");

        // 3. Save the customer name and number to Firestore
        await setDoc(customerDocRef, {
            customerName: name,
            customerNumber: number,
            lastLogin: new Date().toISOString()
        });

        // 4. Redirect to the next page
        window.location.href = "./record.html";

    } catch (e) {
        console.error("Login and Firebase operation failed:", e);
        errorMsg.textContent = "❌ Login failed. Check console for details.";
        errorMsg.style.display = "block";
        loginButton.disabled = false;
        loadingMsg.style.display = "none";
    }
}

// Attach the login function to the button
loginButton.addEventListener('click', login);
</script>

</body>
</html>
