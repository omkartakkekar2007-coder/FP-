<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Record</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            background: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        label {
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 15px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: black;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .back-btn {
            margin-top: 15px;
            background: #555;
        }

        .back-btn:hover {
            background: #333;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Milk Record</h2>

        <label>Date:</label>
        <input type="date" id="date">

        <label>Milk (Litre):</label>
        <input type="number" id="milk" placeholder="Enter milk in litres">

        <button onclick="addRecord()">Add</button>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Milk (L)</th>
                </tr>
            </thead>
            <tbody id="recordList"></tbody>
        </table>

        <button class="back-btn" onclick="goBack()">Back</button>
    </div>

    <script>
        function addRecord() {
            let date = document.getElementById("date").value;
            let milk = document.getElementById("milk").value;

            if (date === "" || milk === "") {
                alert("Please enter both date and milk quantity.");
                return;
            }

            let records = JSON.parse(localStorage.getItem("records")) || [];

            records.push({ date, milk });

            localStorage.setItem("records", JSON.stringify(records));

            loadRecords();
        }

        function loadRecords() {
            let records = JSON.parse(localStorage.getItem("records")) || [];
            let table = document.getElementById("recordList");
            table.innerHTML = "";

            records.forEach((r) => {
                table.innerHTML += `
                    <tr>
                        <td>${r.date}</td>
                        <td>${r.milk}</td>
                    </tr>
                `;
            });
        }

        function goBack() {
            window.location.href = "index.html";
        }

        loadRecords();
    </script>

</body>
</html>
