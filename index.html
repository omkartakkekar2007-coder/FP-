<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Ganesh Dairy – Shop Setup</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif; }

  body {
    background: linear-gradient(135deg,#a8edea,#fed6e3);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  h1 {
    color:#1e7b38;
    margin-bottom:10px;
    font-size:42px;
    animation:fadeDown 1s ease;
  }

  h3 {
    color:#444;
    margin-bottom:20px;
    animation:fadeDown 1.2s ease;
  }

  .setup-box {
    background:rgba(255,255,255,0.95);
    padding:26px 32px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
    text-align:center;
    width:320px;
    animation:fadeUp 1s ease;
  }

  input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:2px solid #1e7b38;
    outline:none;
    font-size:15px;
    transition:0.25s;
  }

  input:focus {
    box-shadow:0 0 10px rgba(0,0,0,0.15);
    transform:scale(1.02);
  }

  button {
    padding:12px 26px;
    margin-top:10px;
    background:#1e7b38;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.25s;
  }

  button:hover { background:#145526; transform:scale(1.03); }

  .error {
    color:#c62828;
    font-size:14px;
    margin-top:10px;
    display:none;
  }
</style>
</head>

<body>

  <h1>🐄 Ganesh Dairy 🥛</h1>
  <h3>Shop Registration</h3>

  <div class="setup-box">
    <input type="text" id="shopNameInput" placeholder="Enter Shop Name" />
    <input type="text" id="ownerName" placeholder="Enter Owner Name" />
    <input type="text" id="shopNumber" placeholder="Enter Shop Mobile Number" />

    <button onclick="saveShop()">Save & Continue</button>

    <div class="error" id="errorMsg">⚠️ Please fill all fields!</div>
  </div>


<script>
function saveShop() {
  const shopName = document.getElementById("shopNameInput").value.trim();
  const owner = document.getElementById("ownerName").value.trim();
  const number = document.getElementById("shopNumber").value.trim();
  const error = document.getElementById("errorMsg");

  if (shopName === "" || owner === "" || number === "") {
    error.style.display = "block";
    return;
  }

  error.style.display = "none";

  // save
  localStorage.setItem("shopName", shopName);
  localStorage.setItem("ownerName", owner);
  localStorage.setItem("shopNumber", number);

  // redirect → customer login page
  window.location.href = "index.html";
}
</script>

</body>
</html>
