<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Record</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #c1ffb0, #a4f28a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 420px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            color: #0b5e20;
        }

        label {
            float: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #0b5e20;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 2px solid #0b5e20;
            border-radius: 5px;
        }

        button {
            width: 100%;
            background: #0b5e20;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #0b5e20;
            padding: 8px;
        }

        th {
            background: #0b5e20;
            color: white;
        }

        #popup {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0b5e20;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="popup">Record Added Successfully!</div>

    <div class="container">
        <h2>Milk Record</h2>

        <label>Date:</label>
        <input type="date" id="date" />

        <label>Milk (Litre):</label>
        <input type="number" id="litre" placeholder="Enter litres" />

        <label>Price (₹):</label>
        <input type="number" id="price" placeholder="Enter price" />

        <button onclick="addRecord()">Add Record</button>

        <table id="recordTable">
            <tr>
                <th>Date</th>
                <th>Milk</th>
                <th>Price</th>
            </tr>
        </table>

        <button onclick="calculateTotal()">Check Total Amount</button>
        <button onclick="window.location.href='page1.html'">← Back</button>
    </div>

    <script>
        function showPopup() {
            let pop = document.getElementById("popup");
            pop.style.display = "block";
            setTimeout(() => { pop.style.display = "none"; }, 2000);
        }

        function loadRecords() {
            let records = JSON.parse(localStorage.getItem("milkRecords")) || [];
            let table = document.getElementById("recordTable");

            records.forEach(r => {
                let row = table.insertRow(-1);
                row.insertCell(0).innerHTML = r.date;
                row.insertCell(1).innerHTML = r.litre + " L";
                row.insertCell(2).innerHTML = "₹" + r.price;
            });
        }

        function addRecord() {
            let date = document.getElementById("date").value;
            let litre = document.getElementById("litre").value;
            let price = document.getElementById("price").value;

            if (!date || !litre || !price) {
                alert("Please fill all fields");
                return;
            }

            let record = { date, litre, price };

            let existing = JSON.parse(localStorage.getItem("milkRecords")) || [];
            existing.push(record);
            localStorage.setItem("milkRecords", JSON.stringify(existing));

            let table = document.getElementById("recordTable");
            let row = table.insertRow(-1);
            row.insertCell(0).innerHTML = date;
            row.insertCell(1).innerHTML = litre + " L";
            row.insertCell(2).innerHTML = "₹" + price;

            showPopup();

            document.getElementById("litre").value = "";
            document.getElementById("price").value = "";
        }

        function calculateTotal() {
            let records = JSON.parse(localStorage.getItem("milkRecords")) || [];
            let total = 0;

            records.forEach(r => {
                total += parseFloat(r.price);
            });

            alert("Total Pending Amount: ₹" + total);
        }

        loadRecords();
    </script>

</body>
</html>
