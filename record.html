<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Record</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #c1fba4, #a7e9af);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: fadeUp 0.9s ease;
        }

        h1 {
            text-align: center;
            color: #1e7b38;
            margin-bottom: 18px;
            font-size: 32px;
        }

        label {
            font-size: 15px;
            font-weight: 600;
            color: #1e7b38;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #1e7b38;
            border-radius: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e7b38;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #17642e;
            transform: scale(1.03);
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        table th {
            background: #1e7b38;
            color: white;
            padding: 10px;
            font-size: 15px;
        }

        table td {
            background: rgba(255,255,255,0.9);
            padding: 10px;
            text-align: center;
        }

        .back-btn {
            margin-top: 15px;
            background: #03583f;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>

    <div class="container">
        <h1>Milk Record</h1>

        <label>Date:</label>
        <input type="date" id="date">

        <label>Milk (Litre):</label>
        <input type="number" id="milk" placeholder="Enter litres">

        <button onclick="saveRecord()">Add Record</button>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Milk</th>
                </tr>
            </thead>
            <tbody id="recordList">
            </tbody>
        </table>

        <button class="back-btn" onclick="goBack()">⬅ Back</button>
    </div>

    <script>
        function saveRecord() {
            const date = document.getElementById("date").value;
            const milk = document.getElementById("milk").value;

            if (date === "" || milk === "") {
                alert("Please enter both date and milk quantity!");
                return;
            }

            let list = JSON.parse(localStorage.getItem("milkRecords")) || [];

            list.push({ date, milk });

            localStorage.setItem("milkRecords", JSON.stringify(list));

            loadRecords();
        }

        function loadRecords() {
            let list = JSON.parse(localStorage.getItem("milkRecords")) || [];
            const table = document.getElementById("recordList");
            table.innerHTML = "";

            list.forEach(r => {
                table.innerHTML += `
                    <tr>
                        <td>${r.date}</td>
                        <td>${r.milk} L</td>
                    </tr>
                `;
            });
        }

        function goBack() {
            window.location.href = "index.html";
        }

        loadRecords();
    </script>

</body>
</html>
